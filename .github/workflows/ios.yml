name: ios
on:
  push: { paths: ["ios/**", ".github/workflows/ios.yml"] }
  pull_request: { paths: ["ios/**"] }
jobs:
  packages:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Swift packages
        run: |
          for p in ios/Packages/*/; do
            echo "== $p"
            if [ -d "$p/Tests" ]; then swift test --package-path "$p" || exit 1
            else swift build --package-path "$p" || exit 1; fi
          done
  app:
    runs-on: macos-15
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate the Xcode project
        run: cd ios && xcodegen
      - name: Build both apps for the simulator
        run: |
          cd ios
          for scheme in LendCustomer LendDriver; do
            xcodebuild build -project Lend.xcodeproj -scheme "$scheme" \
              -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
          done
