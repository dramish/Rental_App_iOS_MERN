services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    # Single-node replica set: required for multi-document transactions.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }" | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017/lend?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-secret-change-me-please}
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  mongo-data:
